# Builds both web apps and publishes them to GitHub Pages on every push to main:
#   Lean & Strong      https://<user>.github.io/<repo>/
#   Skyglass Weather   https://<user>.github.io/<repo>/weather/
# Every two hours it also refreshes the weather app's copy of the South African Weather
# Service data (SAWS doesn't let browsers read its API directly; see weather/scripts/saws-snapshot.mjs).
name: Deploy web app

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            weather/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for GitHub Pages
        run: npx vite build
        env:
          # The site lives at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Build the weather app
        working-directory: weather
        run: |
          npm ci
          npm run typecheck
          npm test
          npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/weather/
      - name: Snapshot SAWS forecasts and warnings
        working-directory: weather
        run: npm run saws-snapshot -- dist/saws
      - run: cp -r weather/dist dist/weather

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
