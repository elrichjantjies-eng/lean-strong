# Builds the signed Android APK. Pushing a version tag (e.g. v1.0.0) publishes it as a
# GitHub Release you can download straight from your phone's browser.
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 compiles for Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: npm run build # BASE_PATH defaults to "/" for the app
      - run: npx cap sync android

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Check the signature and name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK="lean-strong-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -3
          echo "file=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Lean & Strong ${{ steps.apk.outputs.version }}"
            echo
            echo "**Install:** open this page on your Android phone, tap **${{ steps.apk.outputs.file }}** below, then open the download."
            echo "Allow \"Install unknown apps\" for your browser if asked. If Play Protect warns, tap **More details → Install anyway**."
            echo "Updating? Just install over the old app: your data stays."
            echo
            echo "### What's new"
            if [ -n "$PREV" ]; then git log "$PREV..HEAD" --pretty='- %s' --no-merges; else git log --pretty='- %s' --no-merges | head -20; fi
          } > CHANGELOG.md

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Lean & Strong ${{ steps.apk.outputs.version }}
          body_path: CHANGELOG.md
          files: ${{ steps.apk.outputs.file }}
